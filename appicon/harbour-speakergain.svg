<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e86ab"/>
      <stop offset="1" stop-color="#173753"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="96" height="96" rx="22" fill="url(#bg)"/>

  <!-- Glocken: Halbkuppeln mit flacher Unterkante, nach außen gekippt -->

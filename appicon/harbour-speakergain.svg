  <path d="M62 40 A9 9 0 0 1 80 40 Z" fill="#ffffff" transform="rotate(24 71 40)"/>

  <!-- Füße -->
  <line x1="37" y1="77" x2="30" y2="87" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <line x1="63" y1="77" x2="70" y2="87" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>

  <!-- Gehäuse und Zeiger -->
  <circle cx="50" cy="60" r="21" fill="#ffffff"/>
  <line x1="50" y1="60" x2="43" y2="49" stroke="#173753" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="50" y1="60" x2="61" y2="55" stroke="#173753" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Kopfhörer -->
  <path d="M22 62 A28 28 0 0 1 78 62" fill="none" stroke="#ffd166" stroke-width="6" stroke-linecap="round"/>
  <rect x="16" y="56" width="12" height="22" rx="6" fill="#ffd166"/>
  <rect x="72" y="56" width="12" height="22" rx="6" fill="#ffd166"/>
</svg>

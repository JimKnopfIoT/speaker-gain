; Speaker Gain: profile set for USB headphones whose volume control reports a
; dB scale PulseAudio cannot use (Bose Noise Cancelling Wired Earbuds claim
; -25600..0 dB where the real range is -100..0 dB). The mappings are those of
; the default set, so sinks and sources keep their names and the audio policy
; routes to them as before; the paths keep the device's own controls at full
; scale and leave the volume to PulseAudio's software volume.

[General]
auto-profiles = yes

[Mapping analog-stereo]
device-strings = front:%f hw:%f
channel-map = left,right
paths-output = harbour-speakergain-softvol-output
direction = output
priority = 15

[Mapping mono-fallback]
device-strings = hw:%f
channel-map = mono
paths-input = harbour-speakergain-softvol-input
direction = input
priority = 1

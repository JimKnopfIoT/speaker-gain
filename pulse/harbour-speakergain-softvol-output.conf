; Speaker Gain: output path of harbour-speakergain-softvol.conf. PCM stays at
; 0 dB - full scale on these devices - and mute still follows mute. No element
; is merged into the volume, so PulseAudio sets it in software.

[General]
description-key = analog-output-headphones
priority = 99

[Element PCM]
required-any = any
switch = mute
volume = zero
